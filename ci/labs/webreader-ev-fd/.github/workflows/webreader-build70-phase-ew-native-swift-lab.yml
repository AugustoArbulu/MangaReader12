name: WebReader Build70 - EW synthetic native Swift FD lab

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_ev_recoverable_quarantine_lab.py'
      - 'ci/test_build70_ev_recoverable_quarantine.py'
      - 'ci/build70_ev_fd_quarantine.swift'
      - 'ci/test_build70_ev_native_swift_fd.py'
      - '.github/workflows/webreader-build70-phase-ew-native-swift-lab.yml'

permissions:
  contents: read

jobs:
  synthetic-native-swift:
    name: synthetic ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host Swift
        run: swiftc --version
      - name: EV Python + SQLite synthetic model
        run: python3 ci/test_build70_ev_recoverable_quarantine.py -v
      - name: EW native Swift fd synthetic scenarios
        run: python3 ci/test_build70_ev_native_swift_fd.py -v
