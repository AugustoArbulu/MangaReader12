name: WebReader Build70 Phase DF Static iOS12 Mach-O Preflight (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_df_ios12_macho_preflight.py'
      - 'ci/test_build70_df_ios12_macho_preflight.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DF_STATIC_MACHO_PREFLIGHT_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-df-macho-preflight.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build70_df_ios12_macho_preflight.py'
      - 'ci/test_build70_df_ios12_macho_preflight.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DF_STATIC_MACHO_PREFLIGHT_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-df-macho-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic Mach-O metadata and injection tests
        run: |
          python -m unittest discover -s ci -p 'test_build70_df_ios12_macho_preflight.py' -v
      - name: Verify all update and installer hard stops
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('ci/build70_df_ios12_macho_preflight.py').read_text()
          assert 'TARGET_IOS = (12, 0)' in source
          assert 'ALLOWED_DYLIBS = frozenset({"/usr/lib/libSystem.B.dylib"})' in source
          assert 'installation_authorized: bool = False' in source
          assert 'actual_ipad_execution_proven: bool = False' in source
          assert 'app_sandbox_entitlements_validated: bool = False' in source
          assert 'code_signature_validated_on_ios12: bool = False' in source
          for forbidden in ('subprocess', 'socket.', 'os.system(', 'appinst(',
                            'posix_spawn(', 'installApplication:'):
              assert forbidden not in source, forbidden
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS DF: untrusted offline ABI data cannot become installer authority')
          PY

  apple-ios12-arm64-real-linked-cli-preflight:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile two target iOS12 ARM64 CLI binaries and inspect without execution
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          for role in MOBILE HELPER; do
            output="$RUNNER_TEMP/wr-df-${role}-ios12-arm64"
            xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
              -arch arm64 -miphoneos-version-min=12.0 \
              "-DWR_DE_${role}_ROLE" \
              ci/build70_de_ios12_self_identity_probe.c -o "$output"
            file "$output" > "$RUNNER_TEMP/wr-df-${role}-file.txt"
            xcrun otool -hv "$output" > "$RUNNER_TEMP/wr-df-${role}-header.txt"
            xcrun otool -l "$output" > "$RUNNER_TEMP/wr-df-${role}-loads.txt"
            xcrun otool -L "$output" > "$RUNNER_TEMP/wr-df-${role}-dylibs.txt"
            xcrun nm -u "$output" > "$RUNNER_TEMP/wr-df-${role}-imports.txt"
            python ci/build70_df_ios12_macho_preflight.py \
              "$RUNNER_TEMP/wr-df-${role}-file.txt" \
              "$RUNNER_TEMP/wr-df-${role}-header.txt" \
              "$RUNNER_TEMP/wr-df-${role}-loads.txt" \
              "$RUNNER_TEMP/wr-df-${role}-dylibs.txt" \
              "$RUNNER_TEMP/wr-df-${role}-imports.txt"
          done
          echo "PASS DF: two real Xcode linked iOS12 ARM64 CLIs statically audited"
          echo "No code-signature claim, no artifact upload, no IPA/DEB, no installation."
