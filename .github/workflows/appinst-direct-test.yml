name: WebReader Direct appinst iOS12 Test

on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    # This isolated diagnostic IPA must not be rebuilt for every audit-only
    # Python/doc commit. Manual workflow_dispatch remains available.
    paths:
      - 'ci/appinst_direct_probe/**'
      - 'ci/build_appinst_direct_probe.sh'
      - 'ci/test_appinst_direct_probe.py'
      - '.github/workflows/appinst-direct-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-appinst-ipa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 on supported macOS runner
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"

      - name: Build ONE independent iOS12 IPA with safe bundled-spawn first and optional appinst help
        run: bash ci/build_appinst_direct_probe.sh

      - name: Audit signed entitlement, safe read-only metadata, local spawn and opt-in help
        run: python3 ci/test_appinst_direct_probe.py

      - name: Upload independent iOS12 diagnostic IPA (not a WebReader update)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Appinst-Direto-iOS12-TEST
          if-no-files-found: error
          path: |
            WebReader-Appinst-Direto-iOS12-adhoc.ipa
            WebReader-Appinst-Direto-iOS12-adhoc.ipa.sha256
