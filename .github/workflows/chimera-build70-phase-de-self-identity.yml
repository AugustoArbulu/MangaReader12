name: WebReader Build70 Phase DE iOS12 Self-Identity Probe (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_de_ios12_self_identity_probe.c'
      - 'ci/build70_de_self_identity_report.py'
      - 'ci/test_build70_de_self_identity_report.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DE_IOS12_SELF_IDENTITY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-de-self-identity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build70_de_ios12_self_identity_probe.c'
      - 'ci/build70_de_self_identity_report.py'
      - 'ci/test_build70_de_self_identity_report.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DE_IOS12_SELF_IDENTITY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-de-self-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-self-identity-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and execute two synthetic CLI roles, validate untrusted reports
        run: |
          python -m unittest discover -s ci -p 'test_build70_de_self_identity_report.py' -v
      - name: Security hard stops and no self-report authentication
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('ci/build70_de_ios12_self_identity_probe.c').read_text()
          parser = Path('ci/build70_de_self_identity_report.py').read_text()
          assert 'if (argc != 1) return 2;' in code
          assert 'DE_PROCESS_IDENTITY_SCOPE=SELF_ONLY' in code
          assert 'DE_IOS12_HELPER_ISOLATION_VERIFIED=NO' in code
          assert 'DE_INSTALLATION_ATTEMPTED=NO' in code
          assert 'actual_process_separation_proven_on_ios12: bool = False' in parser
          assert 'installation_authorized: bool = False' in parser
          for forbidden in ('posix_spawn(', 'objc_msgSend(', 'installApplication:',
                            'socket(', 'connect(', 'open(', 'appinst(', 'fork('):
              assert forbidden not in code, forbidden
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS DE: SELF ONLY probe and report; no helper entitlement or installation')
          PY

  arm64-ios12-cli-link-no-distribution:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and LINK read-only command-line probes for ARM64 iOS12
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          for role in MOBILE HELPER; do
            output="$RUNNER_TEMP/wr-de-${role}-ios12-arm64"
            xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
              -arch arm64 -miphoneos-version-min=12.0 \
              "-DWR_DE_${role}_ROLE" \
              ci/build70_de_ios12_self_identity_probe.c -o "$output"
            file "$output"
            xcrun nm -u "$output" > "$RUNNER_TEMP/de_${role}_undefined.txt"
            ROLE="$role" OUTPUT="$output" python - <<'PY'
          import os
          from pathlib import Path
          symbols = Path(os.environ['RUNNER_TEMP'], 'de_' + os.environ['ROLE'] + '_undefined.txt').read_text()
          for banned in ('_objc_msgSend', '_posix_spawn', '_fork', '_execve',
                         '_system', '_socket', '_connect', '_open', '_dlopen',
                         '_unlink', '_rename'):
              assert banned not in symbols, banned
          assert Path(os.environ['OUTPUT']).is_file()
          print('PASS DE: iOS12 ARM64 linked self-only CLI ' + os.environ['ROLE'])
          PY
          done
          # The two binaries remain confined to ephemeral runner temp.
          # NEVER upload artifacts, publish Releases, IPA/DEB or execute on iPad.
