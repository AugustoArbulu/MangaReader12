name: WebReader Build63 Read-Only Peer Identity Probe

on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/webreader_chimera_peer_probe63.c'
      - 'ci/test_chimera_peer_probe63.py'
      - 'ci/package_chimera_peer_probe63.py'
      - 'ci/test_chimera_peer_probe63_deb.py'
      - 'ci/package_chimera_persistent_ping_deb.py'
      - 'ci/test_chimera_persistent_ping_deb.py'
      - 'ci/chimera_mobile_ping.entitlements'
      - '.github/workflows/chimera-build63-peer-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wr-build63-peerprobe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-capability-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4

      - name: Xcode with iOS 12 deployment support
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"

      - name: Native macOS TCP and AF_UNIX peer PID tests (no install)
        run: python3 ci/test_chimera_peer_probe63.py

      - name: Build and ad-hoc sign iOS12 arm64 non-root one-shot CLI
        run: |
          xcrun --sdk iphoneos clang -std=c11 -Os -Wall -Wextra -Werror \
            -arch arm64 -miphoneos-version-min=12.0 \
            ci/webreader_chimera_peer_probe63.c \
            -o WebReader-Build63-PeerProbe-iOS12
          codesign --force --sign - --timestamp=none \
            --entitlements ci/chimera_mobile_ping.entitlements \
            WebReader-Build63-PeerProbe-iOS12
          codesign --verify --verbose WebReader-Build63-PeerProbe-iOS12
          shasum -a 256 WebReader-Build63-PeerProbe-iOS12 \
            > WebReader-Build63-PeerProbe-iOS12.sha256
          xcrun lipo -info WebReader-Build63-PeerProbe-iOS12 | grep arm64
          xcrun otool -l WebReader-Build63-PeerProbe-iOS12 > peer63-otool.txt
          grep -Eq 'minos 12.0|version 12.0' peer63-otool.txt
          if grep -q 'LC_DYLD_CHAINED_FIXUPS' peer63-otool.txt; then exit 1; fi

      - name: Package .deb as CLI only, no launchd/install capability
        run: |
          python3 ci/package_chimera_peer_probe63.py
          python3 ci/test_chimera_peer_probe63_deb.py
          test "$(grep -c 'PEER_PID=' ci/webreader_chimera_peer_probe63.c)" -ge 3

      - name: Upload only opt-in peer capability diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Chimera-Build63-PeerProbe-QA-iOS12
          if-no-files-found: error
          path: |
            WebReader-Chimera-PeerProbe63-iOS12.deb
            WebReader-Chimera-PeerProbe63-iOS12.deb.sha256
            WebReader-Build63-PeerProbe-iOS12.sha256
