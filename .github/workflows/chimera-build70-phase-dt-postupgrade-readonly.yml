name: WebReader Build70 Phase DT Before-After SQLite and Offline Text (NO install)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/build70_dt_postupgrade_offline_text_compare.py'
      - 'ci/test_build70_dt_postupgrade_offline_text_compare.py'
      - 'ci/build70_do_preupgrade_baseline_audit.py'
      - 'ci/build70_dj_continuity_report_compare.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DT_POSTUPGRADE_OFFLINE_TEXT_2026-11-11.md'
      - '.github/workflows/chimera-build70-phase-dt-postupgrade-readonly.yml'
  workflow_dispatch:

concurrency:
  # PR-only: drop superseded commits, keep latest HEAD and its macOS gate.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-build-text-continuity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DT strict before/after count and offline aggregation
        run: |
          python -m unittest discover -s ci -p 'test_build70_dt_postupgrade_offline_text_compare.py' -v
          python -m unittest discover -s ci -p 'test_build70_dj_continuity_report_compare.py' -v
          python -m unittest discover -s ci -p 'test_build70_do_preupgrade_baseline_audit.py' -v
      - name: Keep all installed-app, backup and installation hard stops unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('ci/build70_dt_postupgrade_offline_text_compare.py').read_text()
          for item in (
              '"installationAuthorized"',
              '"readyToDistributeIPA"',
              '"offlineImagePayloadBytesVerified"',
              '"samePhysicalDeviceAndMomentEstablished"',
              '"physicalBuild71InstallationProven"',
          ):
              assert item in source
          assert "dict.fromkeys(FALSE_FIELDS, False)" in source
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS DT: before-after untrusted counts only; no real preservation claim')
          PY
