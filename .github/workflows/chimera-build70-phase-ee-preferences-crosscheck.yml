name: WebReader Build70 Phase EE Exported Preferences vs External Plist (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_ee_portable_preferences_plist.py'
      - 'ci/test_build70_ee_portable_preferences_plist.py'
      - 'docs/WEBREADER_BUILD70_PHASE_EE_PREFERENCES_CROSSCHECK_2026-11-12.md'
      - '.github/workflows/chimera-build70-phase-ee-preferences-crosscheck.yml'
permissions:
  contents: read
jobs:
  host-only-preferences:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host-only EA ED EE tests using synthetic databases and plist
        run: |
          python -m unittest discover -s ci -p 'test_build70_ea_external_copy_audit.py' -v
          python -m unittest discover -s ci -p 'test_build70_ed_portable_vs_external_library.py' -v
          python -m unittest discover -s ci -p 'test_build70_ee_portable_preferences_plist.py' -v
      - name: Check publisher trust and one-shot trigger remain disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          ee = Path('ci/build70_ee_portable_preferences_plist.py').read_text()
          assert 'EE_STOP_EXPORTED_PREFERENCES_DIFFER' in ee
          assert 'BUNDLE_ID = "com.example.MangaReader12"' in ee
          for token in ('"installationAuthorized": False', '"restorationAuthorized": False',
                        '"readyToDistributeIPA": False', '"automaticUpdaterEnabled": False'):
              assert token in ee, token
          assert not Path('ci/build71_owner_approved_qa_trigger.txt').exists()
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS EE: synthetic preferences only, no IPA, install or release authority')
          PY
