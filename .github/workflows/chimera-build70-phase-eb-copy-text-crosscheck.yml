name: WebReader Build70 Phase EB External Copy vs Device Text (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_eb_copy_vs_device_text.py'
      - 'ci/test_build70_eb_copy_vs_device_text.py'
      - 'docs/WEBREADER_BUILD70_PHASE_EB_EXTERNAL_COPY_TEXT_CROSSCHECK_2026-11-12.md'
      - '.github/workflows/chimera-build70-phase-eb-copy-text-crosscheck.yml'

permissions:
  contents: read

jobs:
  host-only-copy-text-crosscheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run EA, DO and EB read-only host tests
        run: |
          python -m unittest discover -s ci -p 'test_build70_ea_external_copy_audit.py' -v
          python -m unittest discover -s ci -p 'test_build70_do_preupgrade_baseline_audit.py' -v
          python -m unittest discover -s ci -p 'test_build70_eb_copy_vs_device_text.py' -v
      - name: Verify independent installation and publisher gates
        run: |
          python - <<'PY'
          from pathlib import Path
          eb = Path('ci/build70_eb_copy_vs_device_text.py').read_text()
          for token in ('"readyToDistributeIPA": False', '"readyToInstallIPA": False',
                        '"installationAuthorized": False', '"restorationAuthorized": False',
                        '"automaticUpdaterEnabled": False'):
              assert token in eb, token
          assert not Path('ci/build71_owner_approved_qa_trigger.txt').exists()
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS EB: no install, no publisher trust, no owner delivery trigger')
          PY
