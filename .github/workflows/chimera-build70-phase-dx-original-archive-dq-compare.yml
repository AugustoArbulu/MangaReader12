name: WebReader Build70 Phase DX Original Archive and DQ Text (NO install)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'ci/build70_dx_archived_vs_installed_identity.py'
      - 'ci/test_build70_dx_archived_vs_installed_identity.py'
      - 'ci/build70_dq_installed_bundle_report.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DX_ARCHIVE_TO_DQ_2026-11-11.md'
      - '.github/workflows/chimera-build70-phase-dx-original-archive-dq-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archived-original-versus-untrusted-dq-readonly:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DX hostile archived-envelope vs DQ text regressions
        run: |
          python -m unittest discover -s ci -p 'test_build70_dx_archived_vs_installed_identity.py' -v
          python -m unittest discover -s ci -p 'test_build70_dq_installed_bundle_report.py' -v
      - name: Verify production trust and installer are still disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('ci/build70_dx_archived_vs_installed_identity.py').read_text()
          assert '"currentlyInstalledBuild70CryptographicallyAttested": False' in source
          assert '"archivedNativeCodeSealReverifiedInThisComparison": False' in source
          assert '"readyToDistributeIPA": False' in source
          assert '"installationAuthorized": False' in source
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS DX: original-archive match is never device proof or install authorization')
          PY
