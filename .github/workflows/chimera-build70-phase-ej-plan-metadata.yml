name: WebReader Build70 Phase EJ Recovery Plan Metadata (host only)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_ej_recovery_plan_metadata.py'
      - 'ci/test_build70_ej_recovery_plan_metadata.py'
      - 'docs/WEBREADER_BUILD70_PHASE_EJ_RECOVERY_PLAN_META_2026-11-13.md'
      - '.github/workflows/chimera-build70-phase-ej-plan-metadata.yml'
permissions:
  contents: read
jobs:
  recovery-plan-host-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test EA, ED, EI and EJ synthetic read-only recovery plans
        run: |
          python -m unittest discover -s ci -p 'test_build70_ea_external_copy_audit.py' -v
          python -m unittest discover -s ci -p 'test_build70_ed_portable_vs_external_library.py' -v
          python -m unittest discover -s ci -p 'test_build70_ei_all_downloads_inventory.py' -v
          python -m unittest discover -s ci -p 'test_build70_ej_recovery_plan_metadata.py' -v
      - name: Confirm owner release/install gates remain disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("ci/build70_ej_recovery_plan_metadata.py").read_text()
          for token in ('"installationAuthorized": False',
                        '"restorationAuthorized": False',
                        '"readyToInstallIPA": False',
                        '"readyToDistributeIPA": False',
                        '"automaticUpdaterEnabled": False',
                        'EJ_STOP_RECOVERY_ROWS_REQUIRE_DEVICE_REVIEW',
                        'MAX_PLAN_BYTES = 16 * 1024 * 1024'):
              assert token in src, token
          assert not Path('ci/build71_owner_approved_qa_trigger.txt').exists()
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS EJ: no private plan values leaked and no IPA/install authorization')
          PY
