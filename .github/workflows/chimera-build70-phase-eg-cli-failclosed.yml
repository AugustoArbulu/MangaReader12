name: WebReader Build70 Phase EG CLI STOP Exit Codes (host only)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_ea_external_copy_audit.py'
      - 'ci/test_build70_ea_external_copy_audit.py'
      - 'ci/build70_eh_sqlite_relational_integrity.py'
      - 'ci/test_build70_eh_sqlite_relational_integrity.py'
      - 'ci/build70_eb_copy_vs_device_text.py'
      - 'ci/build70_ec_full_container_dual_copy.py'
      - 'ci/build70_ed_portable_vs_external_library.py'
      - 'ci/build70_ee_portable_preferences_plist.py'
      - 'ci/build70_ef_offline_payload_triage.py'
      - 'ci/test_build70_eg_cli_fail_closed.py'
      - 'docs/WEBREADER_BUILD70_PHASE_EG_FAIL_CLOSED_CLI_2026-11-12.md'
      - '.github/workflows/chimera-build70-phase-eg-cli-failclosed.yml'
permissions:
  contents: read
jobs:
  audit-stop-exit-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full host-only regression EA through EH, including fail-closed CLI
        run: |
          python -m unittest discover -s ci -p 'test_build70_ea_external_copy_audit.py' -v
          python -m unittest discover -s ci -p 'test_build70_eb_copy_vs_device_text.py' -v
          python -m unittest discover -s ci -p 'test_build70_ec_full_container_dual_copy.py' -v
          python -m unittest discover -s ci -p 'test_build70_ed_portable_vs_external_library.py' -v
          python -m unittest discover -s ci -p 'test_build70_ee_portable_preferences_plist.py' -v
          python -m unittest discover -s ci -p 'test_build70_ef_offline_payload_triage.py' -v
          python -m unittest discover -s ci -p 'test_build70_eg_cli_fail_closed.py' -v
          python -m unittest discover -s ci -p 'test_build70_eh_sqlite_relational_integrity.py' -v
      - name: No owner IPA QA trigger or publisher/installer authority
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('ci/build71_owner_approved_qa_trigger.txt').exists()
          for suffix in ('eb_copy_vs_device_text', 'ec_full_container_dual_copy',
                         'ed_portable_vs_external_library', 'ee_portable_preferences_plist',
                         'ef_offline_payload_triage'):
              path = Path('ci/build70_' + suffix + '.py')
              content = path.read_text()
              prefix = suffix[:2].upper()
              assert 'return 2 if result["status"].startswith("' + prefix + '_STOP_") else 0' in content
              assert '"installationAuthorized": False' in content
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          assert 'PRAGMA foreign_key_check' in Path('ci/build70_eh_sqlite_relational_integrity.py').read_text()
          assert 'validate_schema_foreign_keys(db)' in Path('ci/build70_eh_sqlite_relational_integrity.py').read_text()
          assert 'read_database_bytes(db_path, db_hash)' in Path('ci/build70_ea_external_copy_audit.py').read_text()
          assert 'db.deserialize(raw)' in Path('ci/build70_ea_external_copy_audit.py').read_text()
          print("PASS EG: all EA-EH audited, every STOP nonzero; no IPA, install or trust")
          PY
