name: WebReader Chimera Loopback PING QA Kit

on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
  workflow_dispatch:

permissions:
  contents: read

# Only the newest diagnostic build is useful. Do not occupy macOS runners
# with superseded intermediate commits on the experimental feature branch.
concurrency:
  group: webreader-chimera-ipc-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ping-kit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select macOS Xcode 16.4 experimental iOS12 SDK build
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"

      - name: Test native Swift IPC error stages against FAKE appinst
        run: python3 ci/test_native_webreader_appinst_socket.py

      - name: Test PING-only mobile bridge with no installer code
        run: python3 ci/test_chimera_ping_only_bridge.py

      - name: Compile ARM64 iOS12 PING-only bridge with minimal Chimera entitlement
        run: |
          xcrun --sdk iphoneos clang \
            -std=c11 -Os -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -DWEBREADER_PING_ONLY -arch arm64 -miphoneos-version-min=12.0 \
            ci/webreader_appinst_bridge.c \
            -o WebReader-Chimera-Ping-DIAG-iOS12
          codesign --force --sign - --timestamp=none \
            --entitlements ci/chimera_mobile_ping.entitlements \
            WebReader-Chimera-Ping-DIAG-iOS12
          codesign --verify --verbose WebReader-Chimera-Ping-DIAG-iOS12
          /usr/libexec/PlistBuddy -c 'Print :com.apple.private.security.no-container' \
            ci/chimera_mobile_ping.entitlements | grep -x true
          codesign -d --entitlements :- WebReader-Chimera-Ping-DIAG-iOS12 > signed-entitlements.plist 2>/dev/null
          python3 -c "import plistlib; p=plistlib.load(open('signed-entitlements.plist','rb')); assert p=={'com.apple.private.security.no-container': True}, p"
          shasum -a 256 WebReader-Chimera-Ping-DIAG-iOS12 > WebReader-Chimera-Ping-DIAG-iOS12.sha256

      - name: Prepare iOS12 WebReader app assets
        run: |
          chmod +x ci/*.sh
          python3 ci/prepare_webreader_icons.py
          ./ci/prepare_libwebp_ios.sh
          python3 ci/test_ipc_probe_launch.py

      - name: Build iOS12 diagnostic app with isolated Bundle ID
        run: |
          xcodebuild \
            -project MangaReader12.xcodeproj \
            -scheme MangaReader12 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package one IPC diagnostic IPA and checksum
        run: |
          WEBREADER_IPC_PROBE_BUILD=58 bash ci/package_ipc_probe_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-IPC-Probe-iOS12-unsigned.ipa

      - name: Audit IPA and check that PING bridge cannot install apps
        run: python3 ci/test_chimera_mobile_ping_kit.py

      - name: Upload one ZIP for read-only Chimera loopback PING test
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Chimera-Loopback-PING-iOS12
          if-no-files-found: error
          path: |
            WebReader-IPC-Probe-iOS12-unsigned.ipa
            WebReader-IPC-Probe-iOS12-unsigned.ipa.sha256
            WebReader-Chimera-Ping-DIAG-iOS12
            WebReader-Chimera-Ping-DIAG-iOS12.sha256
