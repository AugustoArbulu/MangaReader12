name: iOS 12 Milestone 0

on:
  push:
    # Changes confined to read-only Build70 data auditors or documentation
    # never need a heavyweight iOS compile or diagnostic IPA artifact.
    paths-ignore:
      - 'docs/**'
      - 'ci/build70_e*.py'
      - 'ci/test_build70_e*.py'
      - 'ci/test_build70_ci_scope.py'
      - '.github/workflows/chimera-build66-*.yml'
      - '.github/workflows/chimera-build70-phase-*.yml'
      - '.github/workflows/chimera-build70-phase-e*.yml'
  pull_request:
    # GitHub's default pull_request events omit ready_for_review.
    # Run the full native validation when the owner promotes the Draft PR.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - 'ci/build70_e*.py'
      - 'ci/test_build70_e*.py'
      - 'ci/test_build70_ci_scope.py'
      - '.github/workflows/chimera-build66-*.yml'
      - '.github/workflows/chimera-build70-phase-*.yml'
      - '.github/workflows/chimera-build70-phase-e*.yml'
  workflow_dispatch:

# Superseded macOS builds of the same branch/PR are not useful.
concurrency:
  # Never cancel a deliberate owner-triggered manual build just because
  # unrelated audit pushes arrive on the same branch.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Draft PRs can touch hundreds of historical files; the push trigger
    # still tests real native changes, while PR review enables full validation.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make CI scripts executable
        run: chmod +x ci/*.sh

      - name: Pin Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swiftc --version

      - name: Audit iOS 12 compatibility guardrails
        run: ./ci/audit_ios12.sh

      - name: Prepare approved WebReader AppIcon for iOS12 (offline)
        run: python3 ci/prepare_webreader_icons.py

      - name: Test generated iPhone/iPad app icon resources (offline)
        run: python3 ci/test_build54_icon.py

      - name: Test selected Keiyoushi JS source contract (offline)
        run: node ci/test_m13a_js.cjs

      - name: Test WeebCentral EN source contract (offline)
        run: node ci/test_weebcentral_offline.cjs

      - name: Verify Build44 complete chapter list parser (offline)
        run: node ci/test_build44_chapter_selector.cjs

      - name: Verify Build45 general remote filters (offline)
        run: python3 ci/test_build45_filters.py

      - name: Test Asura public source contract (offline)
        run: node ci/test_asurascans_offline.cjs

      - name: Test Build47 inert Astro props bridge (offline)
        run: node ci/test_build47_astro_props.cjs

      - name: Test Build48 safe image-response diagnostics (Swift offline)
        run: python3 ci/test_build48_image_diagnostics.py

      - name: Test Build46 ImageIO offline image integrity (Swift)
        run: python3 ci/test_build46_download_integrity.py

      - name: Probe Asura native tile permutations (offline Swift)
        run: xcrun swift ci/asura_coregraphics_tiles_probe.swift

      - name: Validate read-only upstream monitor (offline)
        run: python3 ci/test_monitor_keiyoushi_upstream.py

      - name: Test library filters and SQLite reading metrics (offline)
        run: python3 ci/test_library_filters.py

      - name: Verify Build41 reader and library contracts (offline)
        run: python3 ci/test_build41_features.py

      - name: Test native CBZ parser and adversarial archives
        run: python3 ci/test_safe_cbz.py

      - name: Verify Build42 local archive and reader contracts
        run: python3 ci/test_build42_contract.py

      - name: Verify Build43 Comix C2 safety contract (offline)
        run: python3 ci/test_comix_c2_contract.py

      - name: Prepare SHA256-pinned libwebp 1.6.0 for iOS arm64
        run: ./ci/prepare_libwebp_ios.sh

      - name: Test native libwebp decoding with valid/truncated WebP (offline)
        run: python3 ci/test_build49_webp.py

      - name: Test Build51 pinned library and bounded download storage (Swift offline)
        run: python3 ci/test_build51_general.py

      - name: Test Build52 bounded image compatibility geometry (Swift offline)
        run: python3 ci/test_build52_image_engine.py

      - name: Test Build53 pinned favorites in portable backup (Swift offline)
        run: python3 ci/test_build53_backup_pins.py

      - name: Test Build54 WebReader branding and upgrade-safe identity
        run: python3 ci/test_build54_branding.py

      - name: Test Build55 official Keiyoushi source icons
        run: python3 ci/test_build55_source_icons.py

      - name: Test Build56 source attribution and persistent update feed (Swift offline)
        run: python3 ci/test_build56_library_updates.py

      - name: Test Build65 relocatable downloads after iOS app upgrade (Swift offline)
        run: python3 ci/test_build65_offline_relocation.py

      - name: Test EL no silent partial-download replacement (Swift host offline)
        run: python3 -m unittest discover -s ci -p 'test_build70_el_safe_partial_retry.py' -v

      - name: Test EQ canonical offline path ownership (synthetic host)
        run: python3 -m unittest discover -s ci -p 'test_build70_eq_canonical_path_ownership.py' -v

      - name: Test proposed Chimera updater signed-manifest protocol (offline; no installation)
        run: python3 ci/test_webreader_update_manifest.py

      - name: Test offline signed release manifest preparation with ephemeral key
        run: python3 ci/test_prepare_signed_webreader_update.py

      - name: Verify Python OpenSSL signed release with native iOS12 Swift Security
        run: python3 ci/test_cross_language_webreader_release.py

      - name: Test native iOS12 Security.framework update manifest signature policy
        run: python3 ci/test_native_webreader_update_verifier.py

      - name: Test native read-only UpdateChecker with mocked URLSession (zero real network)
        run: python3 ci/test_native_webreader_update_checker.py

      - name: Test direct public GitHub Releases parser and SHA-256 policy (Swift offline)
        run: python3 ci/test_public_github_release_parser.py

      - name: Verify in-app releases screen remains fail-closed (no real requests)
        run: python3 ci/test_app_updates_screen.py

      - name: Verify isolated IPC diagnostic launch cannot access Library or background updates
        run: python3 ci/test_ipc_probe_launch.py

      - name: Test native iOS12 HEAD-only GitHub HTTPS probe with mock network
        run: python3 ci/test_webreader_https_probe.py

      - name: Test signed-metadata IPA staging with streaming SHA256 (no real network)
        run: python3 ci/test_native_webreader_ipa_stager.py

      - name: Test native iOS12 full IPA archive and identity preflight (malicious fixtures)
        run: python3 ci/test_native_webreader_ipa_auditor.py

      - name: Audit appinst .deb format with malicious offline fixtures (no installation)
        run: python3 ci/test_audit_appinst_deb.py

      - name: Test exact pinned mirror index policy (no external requests)
        run: python3 ci/test_audit_pinned_appinst_mirror.py

      - name: Test device-vs-DEB fingerprint policy with synthetic binaries (offline)
        run: python3 ci/test_compare_appinst_fingerprint.py

      - name: Test strict helper IPC proposal contract (offline; no privileged operations)
        run: python3 ci/test_webreader_helper_request_contract.py

      - name: Test one-shot helper review session replay and expiration (offline)
        run: python3 ci/test_webreader_helper_review_session.py

      - name: Test safe staged-IPA file descriptor preflight (offline; no installer)
        run: python3 ci/test_webreader_helper_file_preflight.py

      - name: Test private IPA copy and held-descriptor snapshot (offline; no installer)
        run: python3 ci/test_webreader_private_snapshot.py

      - name: Test portable IPC field-kit verifier with malformed fixtures (offline)
        run: python3 ci/test_verify_ipc_field_kit.py

      - name: Test actual separate-process unprivileged helper UNIX socket (host)
        run: python3 ci/test_webreader_helper_probe.py

      - name: Test actual native Darwin Swift client vs C helper (host)
        run: python3 ci/test_native_webreader_helper_ping.py

      - name: Compile ARM64 iOS12 nonprivileged IPC diagnostic (no installer)
        run: |
          xcrun --sdk iphoneos clang \
            -std=c11 -Os -Wall -Wextra -Werror \
            -arch arm64 -miphoneos-version-min=12.0 \
            ci/webreader_helper_probe.c \
            -o WebReader-Helper-Ping-iOS12
          file WebReader-Helper-Ping-iOS12
          codesign --force --sign - --timestamp=none WebReader-Helper-Ping-iOS12
          codesign --verify --verbose WebReader-Helper-Ping-iOS12
          shasum -a 256 WebReader-Helper-Ping-iOS12 > WebReader-Helper-Ping-iOS12.sha256

      - name: Upload standalone nonprivileged IPC diagnostic (not a DEB or release)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Helper-Ping-iOS12-NONINSTALLER
          if-no-files-found: error
          path: |
            WebReader-Helper-Ping-iOS12
            WebReader-Helper-Ping-iOS12.sha256

      - name: Test mobile appinst bridge against fake executable (no installation)
        run: python3 ci/test_webreader_appinst_bridge.py

      - name: Test actual Swift-to-C appinst socket against fake installer (macOS, offline)
        run: python3 ci/test_native_webreader_appinst_socket.py

      - name: Compile isolated mobile appinst bridge for ARM64 iOS12 (not executed)
        run: |
          xcrun --sdk iphoneos clang \
            -std=c11 -Os -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -arch arm64 -miphoneos-version-min=12.0 \
            ci/webreader_appinst_bridge.c \
            -o WebReader-Appinst-Bridge-iOS12
          codesign --force --sign - --timestamp=none WebReader-Appinst-Bridge-iOS12
          codesign --verify --verbose WebReader-Appinst-Bridge-iOS12
          file WebReader-Appinst-Bridge-iOS12
          shasum -a 256 WebReader-Appinst-Bridge-iOS12 > WebReader-Appinst-Bridge-iOS12.sha256

      - name: Upload mobile appinst bridge CLI preview for disposable-app QA only
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Appinst-Bridge-iOS12-MOBILE-PREVIEW
          if-no-files-found: error
          path: |
            WebReader-Appinst-Bridge-iOS12
            WebReader-Appinst-Bridge-iOS12.sha256

      - name: Build two disposable iOS12 apps for safe appinst v1-to-v2 test
        run: bash ci/build_appinst_disposable.sh

      - name: Validate disposable iOS12 test IPA isolation and build identities
        run: python3 ci/test_appinst_disposable_artifacts.py

      - name: Upload disposable appinst version-1 and version-2 IPAs (NOT WebReader)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Appinst-Disposable-v1-v2-iOS12-QA
          if-no-files-found: error
          path: |
            WebReader-Appinst-Disposable-v1-iOS12-unsigned.ipa
            WebReader-Appinst-Disposable-v1-iOS12-unsigned.ipa.sha256
            WebReader-Appinst-Disposable-v2-iOS12-unsigned.ipa
            WebReader-Appinst-Disposable-v2-iOS12-unsigned.ipa.sha256
            docs/WEBREADER_APPINST_SOCKET_MVP_2026-11-05.md

      - name: Examine byte-pinned published appinst mirror .deb read-only (never execute)
        run: python3 ci/audit_pinned_appinst_mirror.py

      - name: Test WebReader IPA integrity structure with offline malicious fixtures
        run: python3 ci/test_validate_webreader_ipa.py

      - name: Build Debug for generic iOS device
        run: |
          xcodebuild \
            -project MangaReader12.xcodeproj \
            -scheme MangaReader12 \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Build Release for generic iOS device
        run: |
          xcodebuild \
            -project MangaReader12.xcodeproj \
            -scheme MangaReader12 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify Release binary
        run: |
          ./ci/verify_binary.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app"

      - name: Package unsigned IPA for Sideloadly re-signing
        run: |
          ./ci/package_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-iOS12-unsigned.ipa

      - name: Independently verify packaged IPA structure, version and checksum (host only)
        run: |
          python3 ci/validate_webreader_ipa.py \
            WebReader-iOS12-unsigned.ipa \
            --sha256-file WebReader-iOS12-unsigned.ipa.sha256 \
            --installed-build 55 \
            --installed-ios 12.5.8

      - name: Verify actual CI-built Build56 IPA with native Swift ZIP/Info.plist auditor
        run: |
          python3 ci/test_native_webreader_ipa_auditor.py \
            --real-ipa WebReader-iOS12-unsigned.ipa

      - name: Package isolated iOS12 HTTPS diagnostic IPA (CI only; not a release)
        run: |
          ./ci/package_tls_probe_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-TLS-Probe-iOS12-unsigned.ipa

      - name: Assert diagnostic IPA has distinct bundle ID and preserves original
        run: |
          python3 ci/test_tls_probe_ipa.py \
            WebReader-iOS12-unsigned.ipa \
            WebReader-TLS-Probe-iOS12-unsigned.ipa

      - name: Upload standalone HTTPS diagnostic app (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-TLS-Probe-iOS12-Experimental
          if-no-files-found: error
          path: |
            WebReader-TLS-Probe-iOS12-unsigned.ipa
            WebReader-TLS-Probe-iOS12-unsigned.ipa.sha256

      - name: Package ONE iOS12 Chimera test IPA with embedded PING helper (no installer)
        run: |
          bash ci/package_chimera_oneapp_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-Helper-Ping-iOS12

      - name: Verify single-IPA Chimera test has isolated identity and only read-only helper
        run: python3 ci/test_chimera_oneapp_ipa.py

      - name: Upload ONE ready-to-test Chimera IPA (no extra helper file required)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-Chimera-OneApp-iOS12-TEST
          if-no-files-found: error
          path: |
            WebReader-Chimera-Test-iOS12-unsigned.ipa
            WebReader-Chimera-Test-iOS12-unsigned.ipa.sha256

      - name: Package isolated iOS12 IPC diagnostic IPA (CI only; not a release)
        run: |
          bash ci/package_ipc_probe_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-IPC-Probe-iOS12-unsigned.ipa

      - name: Assert IPC diagnostic has distinct identity and unchanged app binary
        run: |
          python3 ci/test_ipc_probe_ipa.py \
            WebReader-iOS12-unsigned.ipa \
            WebReader-TLS-Probe-iOS12-unsigned.ipa \
            WebReader-IPC-Probe-iOS12-unsigned.ipa

      - name: Independently verify packed IPC kit hashes, bundle identity and ARM64 (host)
        run: python3 ci/verify_ipc_field_kit.py --directory .

      - name: Upload isolated iOS12 IPC diagnostic IPA (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-IPC-Probe-iOS12-NONINSTALLER
          if-no-files-found: error
          path: |
            WebReader-IPC-Probe-iOS12-unsigned.ipa
            WebReader-IPC-Probe-iOS12-unsigned.ipa.sha256

      - name: Upload complete iOS12 IPC field-test kit (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-IPC-iOS12-FieldTest-Kit
          if-no-files-found: error
          path: |
            WebReader-IPC-Probe-iOS12-unsigned.ipa
            WebReader-IPC-Probe-iOS12-unsigned.ipa.sha256
            WebReader-Helper-Ping-iOS12
            WebReader-Helper-Ping-iOS12.sha256
            docs/WEBREADER_IPC_DEVICE_TEST_PHASE6B_2026-11-05.md
            ci/verify_ipc_field_kit.py

      - name: Upload app and IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-iOS12-Build56
          if-no-files-found: error
          path: |
            WebReader-iOS12-unsigned.ipa
            WebReader-iOS12-unsigned.ipa.sha256
            ${{ runner.temp }}/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app
