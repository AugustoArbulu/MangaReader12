name: iOS 12 Milestone 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make CI scripts executable
        run: chmod +x ci/*.sh

      - name: Pin Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swiftc --version

      - name: Audit iOS 12 compatibility guardrails
        run: ./ci/audit_ios12.sh

      - name: Prepare approved WebReader AppIcon for iOS12 (offline)
        run: python3 ci/prepare_webreader_icons.py

      - name: Test generated iPhone/iPad app icon resources (offline)
        run: python3 ci/test_build54_icon.py

      - name: Test selected Keiyoushi JS source contract (offline)
        run: node ci/test_m13a_js.cjs

      - name: Test WeebCentral EN source contract (offline)
        run: node ci/test_weebcentral_offline.cjs

      - name: Verify Build44 complete chapter list parser (offline)
        run: node ci/test_build44_chapter_selector.cjs

      - name: Verify Build45 general remote filters (offline)
        run: python3 ci/test_build45_filters.py

      - name: Test Asura public source contract (offline)
        run: node ci/test_asurascans_offline.cjs

      - name: Test Build47 inert Astro props bridge (offline)
        run: node ci/test_build47_astro_props.cjs

      - name: Test Build48 safe image-response diagnostics (Swift offline)
        run: python3 ci/test_build48_image_diagnostics.py

      - name: Test Build46 ImageIO offline image integrity (Swift)
        run: python3 ci/test_build46_download_integrity.py

      - name: Probe Asura native tile permutations (offline Swift)
        run: xcrun swift ci/asura_coregraphics_tiles_probe.swift

      - name: Validate read-only upstream monitor (offline)
        run: python3 ci/test_monitor_keiyoushi_upstream.py

      - name: Test library filters and SQLite reading metrics (offline)
        run: python3 ci/test_library_filters.py

      - name: Verify Build41 reader and library contracts (offline)
        run: python3 ci/test_build41_features.py

      - name: Test native CBZ parser and adversarial archives
        run: python3 ci/test_safe_cbz.py

      - name: Verify Build42 local archive and reader contracts
        run: python3 ci/test_build42_contract.py

      - name: Verify Build43 Comix C2 safety contract (offline)
        run: python3 ci/test_comix_c2_contract.py

      - name: Prepare SHA256-pinned libwebp 1.6.0 for iOS arm64
        run: ./ci/prepare_libwebp_ios.sh

      - name: Test native libwebp decoding with valid/truncated WebP (offline)
        run: python3 ci/test_build49_webp.py

      - name: Test Build51 pinned library and bounded download storage (Swift offline)
        run: python3 ci/test_build51_general.py

      - name: Test Build52 bounded image compatibility geometry (Swift offline)
        run: python3 ci/test_build52_image_engine.py

      - name: Test Build53 pinned favorites in portable backup (Swift offline)
        run: python3 ci/test_build53_backup_pins.py

      - name: Test Build54 WebReader branding and upgrade-safe identity
        run: python3 ci/test_build54_branding.py

      - name: Test Build55 official Keiyoushi source icons
        run: python3 ci/test_build55_source_icons.py

      - name: Test Build56 source attribution and persistent update feed (Swift offline)
        run: python3 ci/test_build56_library_updates.py

      - name: Test proposed Chimera updater signed-manifest protocol (offline; no installation)
        run: python3 ci/test_webreader_update_manifest.py

      - name: Test offline signed release manifest preparation with ephemeral key
        run: python3 ci/test_prepare_signed_webreader_update.py

      - name: Verify Python OpenSSL signed release with native iOS12 Swift Security
        run: python3 ci/test_cross_language_webreader_release.py

      - name: Test native iOS12 Security.framework update manifest signature policy
        run: python3 ci/test_native_webreader_update_verifier.py

      - name: Test native read-only UpdateChecker with mocked URLSession (zero real network)
        run: python3 ci/test_native_webreader_update_checker.py

      - name: Verify in-app releases screen remains fail-closed (no real requests)
        run: python3 ci/test_app_updates_screen.py

      - name: Test signed-metadata IPA staging with streaming SHA256 (no real network)
        run: python3 ci/test_native_webreader_ipa_stager.py

      - name: Audit appinst .deb format with malicious offline fixtures (no installation)
        run: python3 ci/test_audit_appinst_deb.py

      - name: Test exact pinned mirror index policy (no external requests)
        run: python3 ci/test_audit_pinned_appinst_mirror.py

      - name: Examine byte-pinned published appinst mirror .deb read-only (never execute)
        run: python3 ci/audit_pinned_appinst_mirror.py

      - name: Test WebReader IPA integrity structure with offline malicious fixtures
        run: python3 ci/test_validate_webreader_ipa.py

      - name: Build Debug for generic iOS device
        run: |
          xcodebuild \
            -project MangaReader12.xcodeproj \
            -scheme MangaReader12 \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Build Release for generic iOS device
        run: |
          xcodebuild \
            -project MangaReader12.xcodeproj \
            -scheme MangaReader12 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify Release binary
        run: |
          ./ci/verify_binary.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app"

      - name: Package unsigned IPA for Sideloadly re-signing
        run: |
          ./ci/package_ipa.sh \
            "$RUNNER_TEMP/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app" \
            WebReader-iOS12-unsigned.ipa

      - name: Independently verify packaged IPA structure, version and checksum (host only)
        run: |
          python3 ci/validate_webreader_ipa.py \
            WebReader-iOS12-unsigned.ipa \
            --sha256-file WebReader-iOS12-unsigned.ipa.sha256 \
            --installed-build 55 \
            --installed-ios 12.5.8

      - name: Upload app and IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebReader-iOS12-Build56
          if-no-files-found: error
          path: |
            WebReader-iOS12-unsigned.ipa
            WebReader-iOS12-unsigned.ipa.sha256
            ${{ runner.temp }}/DerivedData-Release/Build/Products/Release-iphoneos/MangaReader12.app
