name: WebReader Build70 FI - WAL read-only journal (no installation)
on:
  push:
    branches: [feat/chimera-updater-phase1-protocol-audit]
    paths:
      - 'ci/build70_fi_readonly_shadow_audit.py'
      - 'ci/test_build70_fi_readonly_shadow_audit.py'
      - 'ci/test_build70_fi_native_wal_snapshot.py'
      - '.github/workflows/chimera-build70-phase-fi-wal-readonly-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wal-native-readonly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FI synthetic journal audit and native SQLite WAL concurrency
        run: |
          python -m unittest discover -s ci -p 'test_build70_fi_*.py' -v
      - name: Regression for FH read-only, FG preview and FF gate
        run: |
          python -m unittest discover -s ci -p 'test_build70_fh_strict_readonly_sqlite.py' -v
          python -m unittest discover -s ci -p 'test_build70_fg_preview_api.py' -v
          python -m unittest discover -s ci -p 'test_build70_ff_deletion_gate.py' -v
      - name: Confirm production has no experimental deletion or installer authority
        run: |
          grep -Fq 'static let diagnosticCopyPreviewEnabled = false' MangaReader12/Downloads/ChapterDownloadManager.swift
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let currentSchemaVersion = 1' MangaReader12/Database/SQLiteDatabase.swift
          test ! -e ci/build71_owner_approved_qa_trigger.txt
  ios12-unsigned-recompile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned native WebP and icons for local compile only
        run: |
          chmod +x ci/*.sh
          python3 ci/prepare_webreader_icons.py
          bash ci/prepare_libwebp_ios.sh
      - name: Compile complete iOS 12 app without signing, IPA or upload
        run: |
          xcodebuild -project MangaReader12.xcodeproj \
            -scheme MangaReader12 -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FI-UnsignedOnly" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Verify no production signing/install permission
        run: |
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let productionPublicKeyX963: Data? = nil' MangaReader12/Core/WebReaderUpdateChecker.swift
          grep -Fq 'static let independentlyProvisionedSPKISHA256: String? = nil' MangaReader12/Core/WebReaderProductionPublisherTrust.swift
          test ! -e ci/build71_owner_approved_qa_trigger.txt
