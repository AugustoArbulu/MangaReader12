name: WebReader Build70 Phase CW Native Check-Only (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_cw_checkonly_core.c'
      - 'ci/build70_cw_checkonly_core.h'
      - 'ci/test_build70_cw_checkonly_core.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CW_NATIVE_CHECK_ONLY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-cw-native-checkonly.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build70_cw_checkonly_core.c'
      - 'ci/build70_cw_checkonly_core.h'
      - 'ci/test_build70_cw_checkonly_core.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CW_NATIVE_CHECK_ONLY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-cw-native-checkonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native-and-policy-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native C and Python CN cross-language security checks
        run: |
          python -m unittest discover -s ci -p 'test_build70_cw_checkonly_core.py' -v
          python -m unittest discover -s ci -p 'test_build70_cn_untrusted_check_only_gate.py' -v
      - name: Audit no installer surfaces and preserve production hard stops
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('ci/build70_cw_checkonly_core.c').read_text()
          hdr = Path('ci/build70_cw_checkonly_core.h').read_text()
          for required in ('installer_authorized', 'installation_performed',
                           'publisher_verified', 'artifact_selected_by_client'):
              assert required in hdr
          assert 'WR_CW_MIN_INTERVAL_MS UINT64_C(60000)' in hdr
          assert 'WR_CW_FRAME_BYTES 7u' in hdr
          for forbidden in ('posix_spawn(', 'objc_msgSend(', 'installApplication:',
                            'socket(', 'connect(', 'open(', 'appinst('):
              assert forbidden not in src, forbidden
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS CW: read-only native ingress with all install authority false')
          PY

  ios12-crosscompile-no-execution:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 12-capable compiler
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Compile native policy only for ARM64 iOS 12.0
        shell: bash
        run: |
          xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
            -arch arm64 -miphoneos-version-min=12.0 \
            -c ci/build70_cw_checkonly_core.c \
            -o "$RUNNER_TEMP/webreader-cw-checkonly-ios12-arm64.o"
          file "$RUNNER_TEMP/webreader-cw-checkonly-ios12-arm64.o"
          xcrun nm -g "$RUNNER_TEMP/webreader-cw-checkonly-ios12-arm64.o" > "$RUNNER_TEMP/cw_symbols.txt"
          xcrun nm -u "$RUNNER_TEMP/webreader-cw-checkonly-ios12-arm64.o" > "$RUNNER_TEMP/cw_undefined.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          symbols = (root / 'cw_symbols.txt').read_text()
          undefined = (root / 'cw_undefined.txt').read_text()
          assert '_wr_cw_offer' in symbols
          for forbidden in ('_objc_msgSend', '_posix_spawn', '_fork', '_execve',
                            '_system', '_socket', '_connect', '_open', '_dlopen'):
              assert forbidden not in undefined, forbidden
          print('PASS CW: iOS12 ARM64 policy object only; NO executable helper/IPA/install')
          PY
