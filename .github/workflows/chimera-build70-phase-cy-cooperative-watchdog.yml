name: WebReader Build70 Phase CY Cooperative Watchdog (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_cy_supervisor.c'
      - 'ci/build70_cy_supervisor.h'
      - 'ci/test_build70_cy_supervisor.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CY_COOPERATIVE_WATCHDOG_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-cy-cooperative-watchdog.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build70_cy_supervisor.c'
      - 'ci/build70_cy_supervisor.h'
      - 'ci/test_build70_cy_supervisor.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CY_COOPERATIVE_WATCHDOG_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-cy-cooperative-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-cooperative-timeout-and-concurrency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C host library and execute adversarial supervisor tests
        run: |
          python -m unittest discover -s ci -p 'test_build70_cy_supervisor.py' -v
      - name: Confirm all installation and publisher hard stops
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('ci/build70_cy_supervisor.c').read_text()
          header = Path('ci/build70_cy_supervisor.h').read_text()
          tests = Path('ci/test_build70_cy_supervisor.py').read_text()
          assert 'WR_CY_TIMEOUT_MS UINT64_C(15000)' in header
          assert 'WR_CY_INITIAL_BACKOFF_MS UINT64_C(30000)' in header
          assert 'WR_CY_MAX_BACKOFF_MS UINT64_C(240000)' in header
          for field in ('caller_authenticated', 'publisher_verified',
                        'ipa_bytes_authenticated', 'owner_consent_verified',
                        'installation_authorized', 'installation_performed'):
              assert field in header, field
          assert 'range(250)' in tests
          assert 'wr_cy_ack_cancel' in source
          assert 'cancel_requested' in source
          for forbidden in ('posix_spawn(', 'objc_msgSend(', 'installApplication:',
                            'socket(', 'connect(', 'open(', 'appinst('):
              assert forbidden not in source, forbidden
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS CY: timeout is cooperative and cannot grant installer authority')
          PY

  ios12-arm64-compile-no-execution:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16.4 cross-compile iOS12 ARM64 objects
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
            -arch arm64 -miphoneos-version-min=12.0 \
            -c ci/build70_cx_bounded_scheduler.c \
            -o "$RUNNER_TEMP/wr-cy-dependency-cx-ios12.o"
          xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
            -arch arm64 -miphoneos-version-min=12.0 \
            -c ci/build70_cy_supervisor.c \
            -o "$RUNNER_TEMP/wr-cy-watchdog-ios12.o"
          file "$RUNNER_TEMP/wr-cy-dependency-cx-ios12.o" "$RUNNER_TEMP/wr-cy-watchdog-ios12.o"
          xcrun nm -g "$RUNNER_TEMP/wr-cy-watchdog-ios12.o" > "$RUNNER_TEMP/cy-symbols.txt"
          xcrun nm -u "$RUNNER_TEMP/wr-cy-watchdog-ios12.o" > "$RUNNER_TEMP/cy-undefined.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          symbols = (root / 'cy-symbols.txt').read_text()
          undefined = (root / 'cy-undefined.txt').read_text()
          for name in ('_wr_cy_new', '_wr_cy_offer', '_wr_cy_poll',
                       '_wr_cy_watchdog', '_wr_cy_complete',
                       '_wr_cy_ack_cancel', '_wr_cy_shutdown'):
              assert name in symbols, name
          for forbidden in ('_objc_msgSend', '_posix_spawn', '_fork', '_execve',
                            '_system', '_socket', '_connect', '_open', '_dlopen'):
              assert forbidden not in undefined, forbidden
          print('PASS CY: iOS12 ARM64 objects only, no daemon, IPA, DEB or installation')
          PY
