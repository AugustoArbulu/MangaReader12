name: WebReader Build70 Phase CU Anchored Helper Custody (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_cu_helper_custody_audit.py'
      - 'ci/test_build70_cu_helper_custody_audit.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CU_HELPER_CUSTODY_2026-11-10.md'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'ci/build70_cu_helper_custody_audit.py'
      - 'ci/test_build70_cu_helper_custody_audit.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CU_HELPER_CUSTODY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-cu-helper-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-custody-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify anchored path confinement and reject hostile filesystem fixtures
        run: |
          python -m unittest discover -s ci -p 'test_build70_cu_helper_custody_audit.py' -v
          python ci/build70_cu_helper_custody_audit.py
      - name: Verify production update/installation hard stops
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("ci/build70_cu_helper_custody_audit.py").read_text()
          tests = Path("ci/test_build70_cu_helper_custody_audit.py").read_text()
          assert "installation_authorized: bool = False" in source
          assert "installation_performed: bool = False" in source
          assert "separate_helper_uid_verified_on_device: bool = False" in source
          assert "final_installer_bytes_bound_to_verified_fd: bool = False" in source
          assert "client_write_access_excluded: bool = False" in source
          assert "test_read_only_still_cannot_prove_future_immutability" in tests
          for banned in ("subprocess.run(", "posix_spawn(", "socket.connect(", "urllib.request.",
                         "requests.get(", "os.system(", "LSApplicationWorkspace(", "appinst --"):
              assert banned not in source, banned
          assert "static let productionPublicKeyX963: Data? = nil" in Path("MangaReader12/Core/WebReaderUpdateChecker.swift").read_text()
          assert "static let independentlyProvisionedSPKISHA256: String? = nil" in Path("MangaReader12/Core/WebReaderProductionPublisherTrust.swift").read_text()
          assert "static let liveInstallationEnabled = false" in Path("MangaReader12/Core/WebReaderAppinstSocket.swift").read_text()
          print("PASS CU: host read-only evidence cannot elevate to installer authority")
          PY
