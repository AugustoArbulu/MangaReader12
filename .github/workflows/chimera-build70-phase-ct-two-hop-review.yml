name: WebReader Build70 Phase CT Two-Hop Protected Review (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_ct_two_hop_delivery_lab.py'
      - 'ci/test_build70_ct_two_hop_delivery_lab.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CT_TWO_HOP_DELIVERY_2026-11-10.md'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'ci/build70_ct_two_hop_delivery_lab.py'
      - 'ci/test_build70_ct_two_hop_delivery_lab.py'
      - 'docs/WEBREADER_BUILD70_PHASE_CT_TWO_HOP_DELIVERY_2026-11-10.md'
      - '.github/workflows/chimera-build70-phase-ct-two-hop-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-hop-review-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test swapped names, in-place edits, symlinks, hardlinks, late same-UID mutation
        run: python -m unittest discover -s ci -p 'test_build70_ct_two_hop_delivery_lab.py' -v
      - name: Execute synthetic two-hop demonstration (no IPA or install)
        run: python ci/build70_ct_two_hop_delivery_lab.py
      - name: Confirm publisher and installer remain disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("ci/build70_ct_two_hop_delivery_lab.py").read_text()
          assert "installation_authorized: bool = False" in source
          assert "installation_performed: bool = False" in source
          assert "exact_iOS_installer_consumption_proven: bool = False" in source
          assert "true_privilege_separation_proven: bool = False" in source
          assert "static let productionPublicKeyX963: Data? = nil" in Path("MangaReader12/Core/WebReaderUpdateChecker.swift").read_text()
          assert "static let independentlyProvisionedSPKISHA256: String? = nil" in Path("MangaReader12/Core/WebReaderProductionPublisherTrust.swift").read_text()
          assert "static let liveInstallationEnabled = false" in Path("MangaReader12/Core/WebReaderAppinstSocket.swift").read_text()
          print("PASS CT: no production editor pin, no executable installer, no release")
          PY
