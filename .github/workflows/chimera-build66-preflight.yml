name: WebReader Build66 IPA Preflight Security QA
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build66_ipa_preflight.py'
      - 'ci/test_build66_ipa_preflight.py'
      - 'ci/build66_signed_release_preflight.py'
      - 'ci/test_build66_signed_release_preflight.py'
      - 'ci/build66_code_signature_gate.py'
      - 'ci/test_build66_code_signature_gate.py'
      - 'ci/webreader_update_manifest.py'
      - 'ci/test_webreader_update_manifest.py'
      - 'ci/test_native_webreader_update_verifier.py'
      - 'ci/prepare_signed_webreader_update.py'
      - 'ci/test_prepare_signed_webreader_update.py'
      - 'MangaReader12/Core/WebReaderUpdateManifestVerifier.swift'
      - 'ci/validate_webreader_ipa.py'
      - '.github/workflows/chimera-build66-preflight.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/build66_ipa_preflight.py'
      - 'ci/test_build66_ipa_preflight.py'
      - 'ci/build66_signed_release_preflight.py'
      - 'ci/test_build66_signed_release_preflight.py'
      - 'ci/build66_code_signature_gate.py'
      - 'ci/test_build66_code_signature_gate.py'
      - 'ci/webreader_update_manifest.py'
      - 'ci/test_webreader_update_manifest.py'
      - 'ci/test_native_webreader_update_verifier.py'
      - 'ci/prepare_signed_webreader_update.py'
      - 'ci/test_prepare_signed_webreader_update.py'
      - 'MangaReader12/Core/WebReaderUpdateManifestVerifier.swift'
      - 'ci/validate_webreader_ipa.py'
      - '.github/workflows/chimera-build66-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wr-build66-preflight
  cancel-in-progress: false

jobs:
  synthetic-preflight-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experimental code
        uses: actions/checkout@v4
      - name: Run synthetic IPA negative tests
        run: python3 -W ignore::UserWarning -m unittest discover -s ci -p 'test_build66_ipa_preflight.py' -v
      - name: Verify ECDSA signed manifest binds to exact IPA bytes and identity
        run: |
          python3 ci/test_webreader_update_manifest.py
          python3 ci/test_prepare_signed_webreader_update.py
          python3 -m unittest discover -s ci -p 'test_build66_signed_release_preflight.py' -v
      - name: Ensure live installation remains disabled
        run: |
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'DispatchQueue.main.async { completion(.rejected) }' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let productionPublicKeyX963: Data? = nil' MangaReader12/Core/WebReaderUpdateChecker.swift
      - name: Confirm preflight does not invoke installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = (Path('ci/build66_ipa_preflight.py').read_text() +
                  Path('ci/build66_signed_release_preflight.py').read_text())
          for forbidden in ('subprocess', 'os.system', 'posix_spawn', 'appinst(', 'requests.', 'urllib.request'):
              assert forbidden not in code, forbidden
          print('PASS: no installation or network invocation in preflight')
          PY

  codesign-identity-host-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@v4
      - name: Compile and run real Swift Security.framework verifier
        run: python3 ci/test_native_webreader_update_verifier.py
      - name: Verify native macOS code signing with ephemeral fixtures only
        run: |
          python3 -m unittest discover -s ci -p 'test_build66_code_signature_gate.py' -v
      - name: Verify no installer is enabled in production Swift
        run: |
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let productionPublicKeyX963: Data? = nil' MangaReader12/Core/WebReaderUpdateChecker.swift
      - name: Assert code signing gate is host-only and never authorizes install
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ci/build66_code_signature_gate.py").read_text()
          assert 'if sys.platform != "darwin"' in source
          assert '"installationAuthorized": False' in source
          assert '"installationPerformed": False' in source
          assert '"publisherAuthenticatedByCodeSignature": False' in source
          for forbidden in ('appinst(', 'posix_spawn', 'os.system', 'urllib.request'):
              assert forbidden not in source, forbidden
          print("PASS: codesign fixture gate is read-only")
          PY
