name: WebReader Build69 Dev AC-BB — Isolated Preview and Private QA Admission iOS12

on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'MangaReader12/Core/WebReaderIPAStager.swift'
      - 'MangaReader12/Core/WebReaderGitHubReleaseParser.swift'
      - 'MangaReader12/Core/WebReaderUpdaterSecuritySnapshot.swift'
      - 'MangaReader12/Core/WebReaderProductionSignedReleaseChecker.swift'
      - 'MangaReader12/Core/WebReaderProductionPublisherTrust.swift'
      - 'MangaReader12/Core/WebReaderSignedReleaseTrustGate.swift'
      - 'MangaReader12/Core/WebReaderUpdateManifestVerifier.swift'
      - 'MangaReader12/Core/WebReaderSignedReleaseTrustGate.swift'
      - 'MangaReader12/Core/WebReaderIPADownloadBudget.swift'
      - 'MangaReader12/Core/WebReaderPhysicalQAChecklist.swift'
      - 'MangaReader12/Core/BackupManager.swift'
      - 'MangaReader12/UI/BackupViewController.swift'
      - 'MangaReader12/Database/SQLiteDatabase.swift'
      - 'MangaReader12/Downloads/ChapterDownloadManager.swift'
      - 'MangaReader12/UI/WebReaderAppUpdatesViewController.swift'
      - 'MangaReader12.xcodeproj/project.pbxproj'
      - 'ci/test_native_webreader_ipa_stager.py'
      - 'ci/test_native_webreader_signed_production_discovery.py'
      - 'ci/test_native_webreader_release_channel_separation.py'
      - 'ci/test_native_webreader_ipa_download_budget.py'
      - 'ci/test_native_webreader_physical_qa_checklist.py'
      - 'ci/test_build69_phase_ac_ad_ae_policy.py'
      - 'ci/test_build69_phase_ag_ah_ai_transfer_policy.py'
      - 'ci/test_build69_phase_aj_ak_al_crash_recovery_policy.py'
      - 'ci/test_build69_phase_am_an_signed_discovery_policy.py'
      - 'ci/webreader_update_manifest.py'
      - 'ci/build66_signed_release_preflight.py'
      - 'ci/build69_production_release_preflight.py'
      - 'ci/prepare_signed_webreader_update.py'
      - 'ci/test_build69_phase_ap_aq_ar_production_rehearsal.py'
      - 'ci/build69_publisher_bootstrap_review.py'
      - 'ci/test_build69_phase_at_owner_bootstrap.py'
      - 'ci/build69_owner_rotation_review.py'
      - 'ci/test_build69_phase_au_owner_rotation.py'
      - 'ci/test_build69_phase_av_aw_ax_ay_update_policy.py'
      - 'ci/test_build69_az_backup_restore_consent.py'
      - 'ci/test_build69_az_persisted_library_sqlite.py'
      - 'ci/build69_az_candidate_readiness.py'
      - 'ci/build69_ba_unsigned_candidate_audit.py'
      - 'ci/test_build69_ba_unsigned_candidate_audit.py'
      - 'ci/build69_bb_private_qa_ipa_preflight.py'
      - 'ci/test_build69_bb_private_qa_contract.py'
      - 'ci/test_build69_bb_private_qa_ipa_preflight.py'
      - 'ci/test_build69_az_candidate_readiness.py'
      - 'MangaReader12/Info.plist'
      - 'ci/test_build53_backup_pins.py'
      - 'ci/test_build65_offline_relocation.py'
      - 'ci/test_native_webreader_physical_qa_checklist.py'
      - 'ci/test_native_webreader_update_verifier.py'
      - 'ci/test_native_webreader_update_checker.py'
      - 'ci/test_native_webreader_update_security_snapshot.py'
      - 'ci/test_public_github_release_parser.py'
      - 'ci/test_build69_phase_as_at_owner_trust_policy.py'
      - 'ci/test_native_webreader_owner_trust_readiness.py'
      - 'ci/test_build66_code_signature_gate.py'
      - 'ci/test_app_updates_screen.py'
      - 'ci/test_native_webreader_release_cache_storage.py'
      - 'ci/test_build68_phase_tu_readonly_contract.py'
      - '.github/workflows/chimera-build69-phase-ac-af-integrated-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wr-build69-phase-ac-af-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-offline-and-no-install:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA recheck, whole CDN response, QA-only UI, and library preservation
        run: |
          python3 -m unittest discover -s ci -p 'test_build69_phase_ac_ad_ae_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_ag_ah_ai_transfer_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_aj_ak_al_crash_recovery_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_am_an_signed_discovery_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_ap_aq_ar_production_rehearsal.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_at_owner_bootstrap.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_au_owner_rotation.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_av_aw_ax_ay_update_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_az_backup_restore_consent.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_az_persisted_library_sqlite.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_az_candidate_readiness.py' -v
          python3 ci/build69_az_candidate_readiness.py
          python3 -m unittest discover -s ci -p 'test_build69_ba_unsigned_candidate_audit.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_bb_private_qa_contract.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_release_key_lifecycle_review.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_phase_as_at_owner_trust_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_webreader_update_manifest.py' -v
          python3 -m unittest discover -s ci -p 'test_build66_signed_release_preflight.py' -v
          python3 -m unittest discover -s ci -p 'test_prepare_signed_webreader_update.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_phase_tu_readonly_contract.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_phase_z_download_budget_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_phase_aa_ab_manual_controls.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_phase_w_production_publisher_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_phase_y_monotonic_preview_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_phase_p_local_qa_inventory_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_phase_q_release_cache_policy.py' -v
          python3 ci/test_app_updates_screen.py
          python3 ci/test_build65_offline_relocation.py
          python3 ci/test_build65_upgrade_compatibility.py
          test ! -f ci/build69_candidate_trigger.txt
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let productionPublicKeyX963: Data? = nil' MangaReader12/Core/WebReaderUpdateChecker.swift
          grep -Fq 'static let independentlyProvisionedSPKISHA256: String? = nil' MangaReader12/Core/WebReaderProductionPublisherTrust.swift
          grep -Fq 'static let productionTrustGeneration = 0' MangaReader12/Core/WebReaderProductionPublisherTrust.swift
          echo 'PASS: Build69 AZ data/backup/physical QA checks and explicit version56 not IPA69 gate; no release or install'

  native-swift-arm64-ios12:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode supporting iOS 12 deployment target
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Real Swift tests — protected local import, CDN transfer, forward-only Build and privacy
        run: |
          python3 -m unittest discover -s ci -p 'test_build66_code_signature_gate.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_bb_private_qa_ipa_preflight.py' -v
          python3 ci/test_native_webreader_update_verifier.py
          python3 ci/test_public_github_release_parser.py
          python3 ci/test_native_webreader_update_checker.py
          python3 ci/test_native_webreader_signed_production_discovery.py
          python3 ci/test_native_webreader_owner_trust_readiness.py
          python3 ci/test_native_webreader_release_channel_separation.py
          python3 ci/test_native_webreader_physical_qa_checklist.py
          python3 ci/test_build53_backup_pins.py
          python3 ci/test_build65_offline_relocation.py
          python3 ci/test_native_webreader_ipa_stager.py
          python3 ci/test_native_webreader_local_ipa_review.py
          python3 ci/test_native_webreader_ipa_download_budget.py
          python3 ci/test_native_webreader_update_security_snapshot.py
          python3 ci/test_native_webreader_signed_ipa_joint_audit.py
          python3 ci/test_native_webreader_signed_release_trust_gate.py
          python3 ci/test_native_webreader_release_cache_storage.py
          python3 ci/test_native_webreader_local_qa_storage.py
      - name: Prepare app icons and iOS12 bounded WebP library
        run: |
          chmod +x ci/*.sh
          python3 ci/prepare_webreader_icons.py
          ./ci/prepare_libwebp_ios.sh
      - name: Compile complete iOS12 ARM64 Debug (without producing an IPA)
        run: |
          xcodebuild -project MangaReader12.xcodeproj \
            -scheme MangaReader12 -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/wr69-ac-af-debug" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Compile complete iOS12 ARM64 Release (without producing an IPA)
        run: |
          xcodebuild -project MangaReader12.xcodeproj \
            -scheme MangaReader12 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/wr69-ac-af-release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Compile isolated UNSIGNED Build69 preview (no IPA, no upload, no signing)
        run: |
          # A command-line override changes only the ephemeral build product;
          # Xcode Debug/Release project source remains at build56.
          xcodebuild -project MangaReader12.xcodeproj \
            -scheme MangaReader12 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/wr69-ba-unsigned-preview" \
            CURRENT_PROJECT_VERSION=69 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          python3 ci/build69_ba_unsigned_candidate_audit.py \
            "$RUNNER_TEMP/wr69-ba-unsigned-preview/Build/Products/Release-iphoneos/MangaReader12.app"
          # No GitHub artifact step exists for this .app. It is NOT installable.
          if find "$RUNNER_TEMP/wr69-ba-unsigned-preview" -name '*.ipa' -print -quit | grep -q .; then
            echo 'ERROR: forbidden IPA appeared in isolated preview'
            exit 1
          fi
          git diff --exit-code -- MangaReader12.xcodeproj/project.pbxproj MangaReader12/Info.plist
          test ! -f ci/build69_candidate_trigger.txt
          echo 'PASS: temporary unsigned CFBundleVersion69 ARM64 iOS12 app; no IPA/sign/install'
      - name: Confirm stable identity and no privileged installation
        run: |
          ./ci/verify_binary.sh \
            "$RUNNER_TEMP/wr69-ac-af-release/Build/Products/Release-iphoneos/MangaReader12.app"
          grep -Fq 'static let liveInstallationEnabled = false' MangaReader12/Core/WebReaderAppinstSocket.swift
          grep -Fq 'static let productionPublicKeyX963: Data? = nil' MangaReader12/Core/WebReaderUpdateChecker.swift
          echo 'PASS: Build69 AC-BB unsigned preview69 and temporary signed-fixture QA admission; no real IPA, key or install'
