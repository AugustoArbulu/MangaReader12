          python3 -m unittest discover -s ci -p 'test_build69_bp_offline_paging_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build69_bq_recovery_plan_policy.py' -v
          python3 -m unittest discover -s ci -p 'test_build68_release_key_lifecycle_review.py' -v
