name: WebReader Build70 Phase DN Destructive Startup and QA Guard (no install)
on:
  push:
    branches:
      - feat/chimera-updater-phase1-protocol-audit
    paths:
      - 'ci/build70_dn_startup_data_guard.py'
      - 'ci/test_build70_dn_startup_data_guard.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DN_NON_DESTRUCTIVE_STARTUP_2026-11-11.md'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'ci/build70_dn_startup_data_guard.py'
      - 'ci/test_build70_dn_startup_data_guard.py'
      - 'docs/WEBREADER_BUILD70_PHASE_DN_NON_DESTRUCTIVE_STARTUP_2026-11-11.md'
      - '.github/workflows/chimera-build70-phase-dn-startup-data-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-destructive-path-safety:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check no direct destructive calls on startup or opening upgrade screens
        run: |
          python -m unittest discover -s ci -p 'test_build70_dn_startup_data_guard.py' -v
          python ci/build70_dn_startup_data_guard.py
      - name: Re-run non-destructive real Swift migration/offline source guards
        run: |
          python -m unittest discover -s ci -p 'test_build70_dm_real_swift_preservation_fixture.py' -v
      - name: Verify update publisher/installer gates remain disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('ci/build70_dn_startup_data_guard.py').read_text()
          assert 'checkedStartAndViewLifecycleSections' in source
          assert '"runtimeInvocationGraphProven": False' in source
          assert '"readyToDistributePrivateIPA": False' in source
          assert '"installationAuthorized": False' in source
          assert '"installationPerformed": False' in source
          assert 'static let productionPublicKeyX963: Data? = nil' in Path('MangaReader12/Core/WebReaderUpdateChecker.swift').read_text()
          assert 'static let independentlyProvisionedSPKISHA256: String? = nil' in Path('MangaReader12/Core/WebReaderProductionPublisherTrust.swift').read_text()
          assert 'static let liveInstallationEnabled = false' in Path('MangaReader12/Core/WebReaderAppinstSocket.swift').read_text()
          print('PASS DN: UI startup direct destructive paths rejected, no install authority')
          PY
